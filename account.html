<body>

     <header>
        <div class="logo-container">
           <center>
               <img src="habitbloom-logo-1024.png" alt="HabitBloom Logo" class="logo">
               <h1>HabitBloom</h1>
               
           </center> 
        </div>
    </header>
<!-- Create Account Section -->
    <section id="account-section">
    <h2 id="account-title">Create an Account 🌱</h2>
    <p id="account-description">Start building habits that bloom.</p>
    <br>
    <form id="account-form">
        <div id="signup-fields" >
            <label for="signup-name">
            Username
        </label>
        <br>
        <input
            type="text"
            id="signup-name"
            placeholder="Enter your username"
        >
        </div>
        
        <label for="account-email">
            Email Address
        </label>
        <br>
        <input 
            type="text"
            id="account-email"
            placeholder="Enter your email address"
            required
        >
        <br>
        <label for="account-password">
            Password
        </label>
        <br>
        <input
            type="password"
            id="account-password"
            placeholder="Enter your password"
            maxlength="20" 
            required
        >
        <br>
        <br>
        <button id="account-submit" type="submit">Create Account</button>
    </form>
    <br>
    <center>
        <p>
            Already have an account? 
            <a href="#">Log in</a>
        </p>
    </center>
    <br>
     <a href="main.html" class="button">Explore Features</a>
    </section>
